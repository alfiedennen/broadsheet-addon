name: broadsheet
version: "0.1.16"
slug: broadsheet
# We use the hass-base image which already provides s6-overlay as /init.
# The Supervisor default (`init: true`) would wrap our container with
# `tini` as PID 1, demoting s6-overlay's /init to PID 2 — at which point
# `s6-overlay-suexec` fails with "fatal: can only run as pid 1" and the
# addon dies on every start. Set false to let s6-overlay BE pid 1.
init: false
description: >
  An editorial frontend for Home Assistant. Italic display serif, pages
  not screens, prose not specs. Adapts to whatever your HA install
  already has — areas, devices, entities, people — with no
  lovelace.yaml required.
url: https://github.com/alfiedennen/broadsheet
arch:
  - aarch64
  - amd64

# Pre-built image on GHCR. Without this Supervisor falls back to
# building the Dockerfile locally on the user's HAOS — which fails
# because BUILD_FROM is empty (it's injected by HA's builder action,
# not present at install time). The {arch} placeholder is Supervisor-
# substituted at install time. Tag is implicit — matches `version:`.
image: ghcr.io/alfiedennen/broadsheet-{arch}

# Boot at HA boot, restart on crash
startup: services
boot: auto

# Web UI — what HA links from the add-on page (also wired into the
# sidebar via panel_*)
webui: http://[HOST]:[PORT:8099]
ingress: true
# ingress_port: 0 lets Supervisor allocate dynamically — avoids
# collisions with other add-ons. Hard-coded ports are an anti-pattern.
ingress_port: 0
# WebSocket support through the ingress proxy. Without this, WS frames
# buffer + you get mysterious lag.
ingress_stream: true

# Sidebar entry — show in HA's left nav, one click from anywhere
panel_icon: mdi:home-heart
panel_title: broadsheet
# panel_admin: true means only HA admins can open the panel. Default
# to true since the panel exposes full HA Core API access (subject
# to safety rails). Users can lower in their config if they want.
panel_admin: true
# Without this, the addon installs and is reachable via "Open Web UI"
# on its addon page, but it does NOT appear in HA's sidebar by default.
# (Supervisor defaults this to false even when panel_icon/panel_title
# are set — verified during M5 verification on 2026-05-13.) For an
# editorial frontend that's meant to be one click away, sidebar
# placement is the whole point.
ingress_panel: true

# Map the add-on's persistent /data/ to the HA snapshot system.
# `addon_config:rw` makes /data/broadsheet.json survive container
# restarts AND be included in HA backups.
#
# `homeassistant_config:rw` mounts the user's HA config dir at
# /homeassistant. We use it ONLY to drop broadsheet.yaml into
# /homeassistant/themes/ on first boot (never overwriting) — the v0.1
# half of the replacement vision. The add-on touches nothing else in
# the user's config; the theme is fully opt-in + reversible.
map:
  - addon_config:rw
  - homeassistant_config:rw

# Permissions
hassio_api: true
homeassistant_api: true
hassio_role: default

# Options shown in the add-on's Configuration tab
options:
  log_level: info
  curation_path: /data/broadsheet.json
  region: GB
  tmdb_api_key: ""
  # false (default) = broadsheet can control your house — turn lights
  # on/off, set climate, etc. You installed it as your dashboard, so
  # this is the sane default. Set true to make it a read-only viewer.
  # (`lock.*` is hard-banned in broadsheet regardless of this setting.)
  read_only: false

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  curation_path: str
  region: match(^[A-Z]{2}$)
  tmdb_api_key: password?
  read_only: bool
