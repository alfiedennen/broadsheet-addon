name: broadsheet
version: "0.3.0"
slug: broadsheet
# We use the hass-base image which already provides s6-overlay as /init.
# The Supervisor default (`init: true`) would wrap our container with
# `tini` as PID 1, demoting s6-overlay's /init to PID 2 — at which point
# `s6-overlay-suexec` fails with "fatal: can only run as pid 1" and the
# addon dies on every start. Set false to let s6-overlay BE pid 1.
init: false
description: >
  An editorial frontend for Home Assistant. Italic display serif, pages
  not screens, prose not specs. Adapts to whatever your HA install
  already has — areas, devices, entities, people — with no
  lovelace.yaml required.
url: https://github.com/alfiedennen/broadsheet
arch:
  - aarch64
  - amd64

# Pre-built image on GHCR. Without this Supervisor falls back to
# building the Dockerfile locally on the user's HAOS — which fails
# because BUILD_FROM is empty (it's injected by HA's builder action,
# not present at install time). The {arch} placeholder is Supervisor-
# substituted at install time. Tag is implicit — matches `version:`.
image: ghcr.io/alfiedennen/broadsheet-{arch}

# Boot at HA boot, restart on crash
startup: services
boot: auto

# ── v0.2 architecture: broadsheet served on a dedicated host port ──────
# v0.1 ran broadsheet inside an HA ingress iframe — which meant HA's
# panel chrome (top bar + hamburger + addon name label) wrapped every
# broadsheet page. v0.2 bypasses ingress entirely: addon container
# still runs nginx + sidecar, but on a dedicated port the browser
# hits directly. No HA chrome anywhere. broadsheet IS the page.
#
# Sidebar discoverability: on first boot, the addon registers a
# Lovelace dashboard via WS API that points at a launcher card; one
# tap from HA's sidebar → window.top redirect → broadsheet's URL.
# See init/register-launcher.py.
#
# Default port 8124 (avoids common addon collisions: Music Assistant
# 8095, Zigbee2MQTT 8485, ESPHome 6052). Configurable via add-on UI:
# Settings → Add-ons → broadsheet → Network → change "Web frontend"
# mapping. If you change the host port, also update the launcher's
# target via the "host_port_override" option below (because the
# Lovelace launcher JS bakes the port at install time).
ports:
  8124/tcp: 8124
ports_description:
  8124/tcp: Web frontend — your dashboard URL
webui: http://[HOST]:[PORT:8124]

# Map the add-on's persistent /data/ to the HA snapshot system.
# `addon_config:rw` makes /data/broadsheet.json survive container
# restarts AND be included in HA backups.
#
# `homeassistant_config:rw` mounts the user's HA config dir at
# /homeassistant. We use it to:
#   - Drop broadsheet.yaml into /homeassistant/themes/ (opt-in HA theme)
#   - Drop the launcher JS into /homeassistant/www/ (Lovelace serves
#     this at /local/ — required for the panel_custom redirect element)
# The add-on touches nothing else in the user's config.
map:
  - addon_config:rw
  - homeassistant_config:rw

# Permissions
hassio_api: true
homeassistant_api: true
hassio_role: default

# Options shown in the add-on's Configuration tab
options:
  log_level: info
  curation_path: /data/broadsheet.json
  region: GB
  tmdb_api_key: ""
  # false (default) = broadsheet can control your house — turn lights
  # on/off, set climate, etc. You installed it as your dashboard, so
  # this is the sane default. Set true to make it a read-only viewer.
  # (`lock.*` is hard-banned in broadsheet regardless of this setting.)
  read_only: false
  # If you changed the host port in Network settings AND want the
  # sidebar entry to redirect to that custom port, set this. Leave as
  # 0 to use the default 8124. (v0.2.1 will detect this automatically.)
  host_port_override: 0

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  curation_path: str
  region: match(^[A-Z]{2}$)
  tmdb_api_key: password?
  read_only: bool
  host_port_override: int(0,65535)
